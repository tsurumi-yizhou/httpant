# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review configuration. Schema: https://coderabbit.ai/integrations/schema.v2.json
language: "zh-CN"
early_access: false

reviews:
  # Rigorous feedback matching the project's AGENTS.md standards; switch to "chill" if too noisy.
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main
  path_filters:
    - "!docs/rfc*.txt" # RFC reference texts (docs/rfc*.txt), no review needed
  tools:
    # CodeRabbit's bundled clang (v14) and cppcheck (v2.19) cannot parse the
    # C++23 named modules in modules/*.cppm and would emit false positives.
    clang:
      enabled: false
    cppcheck:
      enabled: false

chat:
  auto_reply: true
