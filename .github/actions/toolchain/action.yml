name: toolchain
description: Install CMake, Ninja, the xclang release for this runner and vcpkg at the baseline in vcpkg-configuration.json, and restore the vcpkg caches of a preset's build directory.

inputs:
  preset:
    description: Configure preset whose build directory holds the vcpkg caches
    required: true
  xclang-version:
    description: xclang release
    default: 23.1.3.6

outputs:
  installed-key:
    description: Cache key for the installed vcpkg dependencies
    value: ${{ steps.installed.outputs.cache-primary-key }}
  installed-hit:
    description: Whether the installed dependencies matched that key
    value: ${{ steps.installed.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Install build tools
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade 'cmake>=4.0' ninja
        case "$RUNNER_OS" in
          Linux)
            sudo apt-get update
            sudo apt-get install -y autoconf autoconf-archive automake libtool ;;
          macOS) brew install autoconf autoconf-archive automake libtool ;;
        esac

    # The release archive is the one that runs on this runner; the build target
    # follows from it in cmake/toolchain.cmake.
    - name: Fetch xclang
      shell: bash
      env:
        XCLANG_VERSION: ${{ inputs.xclang-version }}
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in X64) arch=x86_64 ;; ARM64) arch=aarch64 ;; esac
        case "$RUNNER_OS" in
          Linux) host=unknown-linux-gnu ;;
          macOS) host=apple-darwin ;;
          Windows) host=w64-mingw32 ;;
        esac
        name="xclang-$XCLANG_VERSION-$arch-$host.tar.xz"
        temporary="$RUNNER_TEMP"
        if [ "$RUNNER_OS" = Windows ]; then
          temporary="$(cygpath -u "$temporary")"
        fi
        curl -fsSL --retry 3 "https://github.com/clice-io/xclang/releases/download/$XCLANG_VERSION/$name" -o "$temporary/$name"
        tar -xf "$temporary/$name" -C "$temporary"
        root="$temporary/xclang"
        if [ "$RUNNER_OS" = Windows ]; then
          root="$(cygpath -m "$root")"
        fi
        echo "XCLANG_ROOT=$root" >> "$GITHUB_ENV"

    # vcpkg is checked out at the builtin baseline the manifest names.
    - name: Install vcpkg
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/vcpkg"
        if [ "$RUNNER_OS" = Windows ]; then
          root="$(cygpath -m "$root")"
        fi
        baseline="$(python -c "import json; print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")"
        git init -q "$root"
        git -C "$root" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
        git -C "$root" checkout -q FETCH_HEAD
        if [ "$RUNNER_OS" = Windows ]; then
          cmd //c "$(cygpath -w "$root/bootstrap-vcpkg.bat")" -disableMetrics
        else
          "$root/bootstrap-vcpkg.sh" -disableMetrics
        fi
        echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

    - name: Cache vcpkg downloads
      uses: actions/cache@v6
      with:
        path: build/${{ inputs.preset }}/vcpkg-downloads
        key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: vcpkg-downloads-${{ runner.os }}-

    # Restored here and saved by the workflow after configuring, so a failing
    # build keeps the installed dependencies.
    - name: Restore installed vcpkg dependencies
      id: installed
      uses: actions/cache/restore@v6
      with:
        path: build/${{ inputs.preset }}/vcpkg_installed
        key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.xclang-version }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/toolchain.cmake') }}
        restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ inputs.xclang-version }}-
