name: toolchain
description: Install CMake, Ninja, clang for this runner and vcpkg at the baseline in vcpkg-configuration.json, and restore the vcpkg caches of a preset's build directory.

inputs:
  preset:
    description: Configure preset whose build directory holds the vcpkg caches
    required: true
  llvm-version:
    description: LLVM release (Linux takes its major from apt.llvm.org)
    default: 23.1.5
  xclang-version:
    description: xclang release for Windows
    default: 23.1.5.2

outputs:
  installed-key:
    description: Cache key for the installed vcpkg dependencies
    value: ${{ steps.installed.outputs.cache-primary-key }}
  installed-hit:
    description: Whether the installed dependencies matched that key
    value: ${{ steps.installed.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.x"

    - name: Install build tools
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade 'cmake>=4.5' ninja
        case "$RUNNER_OS" in
          Linux)
            sudo apt-get update
            sudo apt-get install -y autoconf autoconf-archive automake libtool ;;
          macOS) brew install autoconf autoconf-archive automake libtool ;;
        esac

    # Linux takes clang from apt.llvm.org and macOS from the LLVM release; both
    # ship libc++ with its modules manifest. Upstream ships no libc++ for the
    # MSVC target, so Windows takes clang-cl from the xclang release, whose
    # configuration file selects the libc++ it bundles.
    - name: Fetch clang
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.llvm-version }}
        XCLANG_VERSION: ${{ inputs.xclang-version }}
      run: |
        set -euo pipefail
        temporary="$RUNNER_TEMP"
        case "$RUNNER_OS" in
          Linux)
            major="${LLVM_VERSION%%.*}"
            . /etc/os-release
            curl -fsSL --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key |
              sudo gpg --dearmor --yes -o /usr/share/keyrings/llvm-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-$major main" |
              sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update
            sudo apt-get install -y "clang-$major" "clang-tools-$major" "llvm-$major" \
              "libc++-$major-dev" "libc++abi-$major-dev" "libclang-rt-$major-dev"
            root="/usr/lib/llvm-$major"
            id="apt-$("$root/bin/clang" -dumpversion)" ;;
          macOS)
            case "$RUNNER_ARCH" in ARM64) arch=ARM64 ;; esac
            name="LLVM-$LLVM_VERSION-macOS-$arch"
            curl -fsSL --retry 3 "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz" -o "$temporary/$name.tar.xz"
            tar -xf "$temporary/$name.tar.xz" -C "$temporary"
            root="$temporary/$name"
            id="llvm-$LLVM_VERSION" ;;
          Windows)
            case "$RUNNER_ARCH" in X64) arch=x86_64 ;; ARM64) arch=aarch64 ;; esac
            name="xclang-$XCLANG_VERSION-$arch-w64-mingw32.tar.xz"
            temporary="$(cygpath -u "$temporary")"
            curl -fsSL --retry 3 "https://github.com/clice-io/xclang/releases/download/$XCLANG_VERSION/$name" -o "$temporary/$name"
            tar -xf "$temporary/$name" -C "$temporary"
            root="$(cygpath -m "$temporary/xclang")"
            id="xclang-$XCLANG_VERSION" ;;
        esac
        echo "CLANG_ROOT=$root" >> "$GITHUB_ENV"
        echo "CLANG_ID=$id" >> "$GITHUB_ENV"

    # vcpkg is checked out at the builtin baseline the manifest names.
    - name: Install vcpkg
      shell: bash
      run: |
        set -euo pipefail
        root="$RUNNER_TEMP/vcpkg"
        if [ "$RUNNER_OS" = Windows ]; then
          root="$(cygpath -m "$root")"
        fi
        baseline="$(python -c "import json; print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")"
        git init -q "$root"
        git -C "$root" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
        git -C "$root" checkout -q FETCH_HEAD
        if [ "$RUNNER_OS" = Windows ]; then
          cmd //c "$(cygpath -w "$root/bootstrap-vcpkg.bat")" -disableMetrics
        else
          "$root/bootstrap-vcpkg.sh" -disableMetrics
        fi
        echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

    - name: Cache vcpkg downloads
      uses: actions/cache@v6
      with:
        path: build/${{ inputs.preset }}/vcpkg-downloads
        key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: vcpkg-downloads-${{ runner.os }}-

    # Restored here and saved by the workflow after configuring, so a failing
    # build keeps the installed dependencies.
    - name: Restore installed vcpkg dependencies
      id: installed
      uses: actions/cache/restore@v6
      with:
        path: build/${{ inputs.preset }}/vcpkg_installed
        key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ env.CLANG_ID }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/toolchain.cmake') }}
        restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ inputs.preset }}-${{ env.CLANG_ID }}-
