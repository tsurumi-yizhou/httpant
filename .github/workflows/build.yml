name: build

# Two configurations, because they are two products:
#
#   protocol   the sans-I/O library and its test suite, on every platform
#   io         the native engine (io_uring, kqueue, IORing)
#
# Both need an xclang release tree — C++23 modules are the whole point of this
# library. Dependencies come from the builtin vcpkg registry at the baseline in
# vcpkg-configuration.json and build with the same compiler through
# cmake/triplets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  XCLANG_VERSION: 23.1.3.6

jobs:
  protocol:
    name: protocol ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: httpant
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            xclang_triple: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-15
            xclang_triple: aarch64-apple-darwin
          - name: windows-x64
            os: windows-2025
            xclang_triple: x86_64-w64-mingw32
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v7
        with:
          path: httpant

      - name: Fetch xclang
        shell: bash
        run: |
          set -euo pipefail
          name="xclang-$XCLANG_VERSION-${{ matrix.xclang_triple }}.tar.xz"
          temporary="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            temporary="$(cygpath -u "$temporary")"
          fi
          curl -fsSL --retry 3 "https://github.com/clice-io/xclang/releases/download/$XCLANG_VERSION/$name" -o "$temporary/$name"
          tar -xf "$temporary/$name" -C "$temporary"
          root="$temporary/xclang"
          if [ "$RUNNER_OS" = Windows ]; then
            root="$(cygpath -m "$root")"
          fi
          echo "XCLANG_ROOT=$root" >> "$GITHUB_ENV"

      # The builtin baseline in vcpkg-configuration.json must be in the clone's
      # history, so the clone is not shallow.
      - name: Install vcpkg
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ -f "$VCPKG_ROOT/bootstrap-vcpkg.sh" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          fi

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/httpant/build/vcpkg-downloads
          key: vcpkg-protocol-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-protocol-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DHTTPANT_ENABLE_IO=OFF

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: protocol-logs-${{ matrix.name }}
          path: |
            httpant/build/vcpkg-manifest-install.log
            httpant/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  io:
    name: io ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: httpant
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            xclang_triple: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-15
            xclang_triple: aarch64-apple-darwin
          - name: windows-x64
            os: windows-2025
            xclang_triple: x86_64-w64-mingw32
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v7
        with:
          path: httpant

      - name: Fetch xclang
        shell: bash
        run: |
          set -euo pipefail
          name="xclang-$XCLANG_VERSION-${{ matrix.xclang_triple }}.tar.xz"
          temporary="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            temporary="$(cygpath -u "$temporary")"
          fi
          curl -fsSL --retry 3 "https://github.com/clice-io/xclang/releases/download/$XCLANG_VERSION/$name" -o "$temporary/$name"
          tar -xf "$temporary/$name" -C "$temporary"
          root="$temporary/xclang"
          if [ "$RUNNER_OS" = Windows ]; then
            root="$(cygpath -m "$root")"
          fi
          echo "XCLANG_ROOT=$root" >> "$GITHUB_ENV"

      # The builtin baseline in vcpkg-configuration.json must be in the clone's
      # history, so the clone is not shallow.
      - name: Install vcpkg
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ -f "$VCPKG_ROOT/bootstrap-vcpkg.sh" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          fi

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/httpant/build/vcpkg-downloads
          key: vcpkg-io-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-io-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DHTTPANT_ENABLE_IO=ON

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: io-logs-${{ matrix.name }}
          path: |
            httpant/build/vcpkg-manifest-install.log
            httpant/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
