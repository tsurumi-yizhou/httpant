name: build

# Two configurations, because they are two products:
#
#   protocol   the sans-I/O library and its test suite, on every platform
#   io         the native engine (io_uring, kqueue, IORing)
#
# Both need an xclang tree (vars.XCLANG_URL) — C++23 modules are the whole point
# of this library — and the vcpkg-registry checkout beside this one, whose
# triplets build the dependencies with the same compiler.
#
#   vars.HTTPANT_TRIPLETS_URL    git URL of vcpkg-registry
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: protocol ${{ matrix.name }}
    if: vars.XCLANG_URL != '' && vars.HTTPANT_TRIPLETS_URL != ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: httpant
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
          - name: windows-x64
            os: windows-2025
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v5
        with:
          path: httpant

      - name: Fetch current registry ports
        shell: bash
        run: git clone --depth 1 "${{ vars.HTTPANT_TRIPLETS_URL }}" ../vcpkg-registry

      - name: Fetch xclang
        shell: bash
        run: |
          set -euo pipefail
          url="${{ vars.XCLANG_URL }}"
          case "$url" in
            *.tar.zst) curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
            *.tar.xz)  curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar -xf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
            *)         curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar -xzf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
          esac
          echo "XCLANG_ROOT=$RUNNER_TEMP/xclang" >> "$GITHUB_ENV"

      - name: Install vcpkg (latest)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ -f "$VCPKG_ROOT/bootstrap-vcpkg.sh" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          fi

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/httpant/build/vcpkg-downloads
          key: vcpkg-protocol-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-protocol-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DHTTPANT_ENABLE_IO=OFF

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-logs-${{ matrix.name }}
          path: |
            httpant/build/vcpkg-manifest-install.log
            httpant/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  io:
    name: io ${{ matrix.name }}
    if: vars.XCLANG_URL != '' && vars.HTTPANT_TRIPLETS_URL != ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: httpant
    strategy:
      fail-fast: false
      matrix:
        include:
          # IORing needs Windows 11 22H2's kernel, which a hosted runner may not
          # have; the engine is compiled there and tested where the kernel allows.
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v5
        with:
          path: httpant

      - name: Fetch current registry ports
        shell: bash
        run: git clone --depth 1 "${{ vars.HTTPANT_TRIPLETS_URL }}" ../vcpkg-registry

      - name: Fetch xclang
        shell: bash
        run: |
          set -euo pipefail
          url="${{ vars.XCLANG_URL }}"
          case "$url" in
            *.tar.zst) curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
            *.tar.xz)  curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar -xf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
            *)         curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar -xzf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
          esac
          echo "XCLANG_ROOT=$RUNNER_TEMP/xclang" >> "$GITHUB_ENV"

      - name: Install vcpkg (latest)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ -f "$VCPKG_ROOT/bootstrap-vcpkg.sh" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          fi

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/httpant/build/vcpkg-downloads
          key: vcpkg-io-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-io-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DHTTPANT_ENABLE_IO=ON

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: io-logs-${{ matrix.name }}
          path: |
            httpant/build/vcpkg-manifest-install.log
            httpant/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
