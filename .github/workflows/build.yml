name: build

# Two configurations, because they are two products:
#
#   protocol   the sans-I/O library and its test suite, on every platform
#   io         the native engine (io_uring, kqueue, IORing)
#
# Both need an xclang tree (vars.XCLANG_URL) — C++23 modules are the whole point
# of this library. The io job additionally needs the vcpkg triplets from
# vcpkg-registry, because the dependencies have to be built by the same compiler
# as the engine: liburing configured against a system compiler expects kernel
# headers a sysrooted clang does not have.
#
#   vars.HTTPANT_TRIPLETS_URL    git URL of vcpkg-registry
#   vars.HTTPANT_TRIPLETS_REF    optional: a commit of it
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: protocol ${{ matrix.name }}
    if: vars.XCLANG_URL != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      XCLANG_TARGET: ${{ matrix.target }}
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v5


      - name: Fetch xclang
        shell: bash
        run: |
          set -euo pipefail
          url="${{ vars.XCLANG_URL }}"
          case "$url" in
            *.tar.zst) curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
            *.tar.xz)  curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar -xf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
            *)         curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar -xzf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
          esac
          echo "XCLANG_ROOT=$RUNNER_TEMP/xclang" >> "$GITHUB_ENV"

      - name: Install vcpkg (latest)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ -f "$VCPKG_ROOT/bootstrap-vcpkg.sh" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          fi

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg/downloads
          key: vcpkg-protocol-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-protocol-${{ runner.os }}-

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DHTTPANT_ENABLE_IO=OFF

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-logs-${{ matrix.name }}
          path: |
            build/vcpkg-manifest-install.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  io:
    name: io ${{ matrix.name }}
    if: vars.XCLANG_URL != '' && vars.HTTPANT_TRIPLETS_URL != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # IORing needs Windows 11 22H2's kernel, which a hosted runner may not
          # have; the engine is compiled there and tested where the kernel allows.
          - name: linux-x64
            os: ubuntu-24.04
            triplet: x64-linux-xclang
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-15
            triplet: arm64-osx-xclang
            target: aarch64-apple-darwin
    env:
      XCLANG_TARGET: ${{ matrix.target }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v5

      - name: Fetch xclang
        shell: bash
        run: |
          set -euo pipefail
          url="${{ vars.XCLANG_URL }}"
          case "$url" in
            *.tar.zst) curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
            *.tar.xz)  curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar -xf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
            *)         curl -fsSL "$url" -o "$RUNNER_TEMP/xclang.tar"; tar -xzf "$RUNNER_TEMP/xclang.tar" -C "$RUNNER_TEMP" ;;
          esac
          echo "XCLANG_ROOT=$RUNNER_TEMP/xclang" >> "$GITHUB_ENV"

      - name: Fetch the xclang triplets
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "${{ vars.HTTPANT_TRIPLETS_URL }}" "$RUNNER_TEMP/vcpkg-registry"
          if [ -n "${{ vars.HTTPANT_TRIPLETS_REF }}" ]; then
            git -C "$RUNNER_TEMP/vcpkg-registry" fetch --depth 1 origin "${{ vars.HTTPANT_TRIPLETS_REF }}"
            git -C "$RUNNER_TEMP/vcpkg-registry" checkout -q FETCH_HEAD
          fi
          echo "VCPKG_OVERLAY_TRIPLETS=$RUNNER_TEMP/vcpkg-registry/triplets" >> "$GITHUB_ENV"

      - name: Install vcpkg (latest)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ -f "$VCPKG_ROOT/bootstrap-vcpkg.sh" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          fi

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg/downloads
          key: vcpkg-io-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-io-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DHTTPANT_ENABLE_IO=ON

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: io-logs-${{ matrix.name }}
          path: |
            build/vcpkg-manifest-install.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
