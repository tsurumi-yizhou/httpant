name: build

# The debug preset in two configurations, because they are two products:
#
#   protocol   the sans-I/O library and its test suite, on every platform
#   io         the native engine (io_uring, kqueue, IORing)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.product }} ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        product: [protocol, io]
        name: [linux-x64, macos-arm64, windows-x64]
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
          - name: windows-x64
            os: windows-2025
          - product: protocol
            io: OFF
          - product: io
            io: ON
    steps:
      - uses: actions/checkout@v7

      - id: toolchain
        uses: ./.github/actions/toolchain
        with:
          preset: debug

      - name: Configure
        run: cmake --preset debug -DHTTPANT_ENABLE_IO=${{ matrix.io }}

      - name: Cache installed vcpkg dependencies
        if: steps.toolchain.outputs.installed-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/debug/vcpkg_installed
          key: ${{ steps.toolchain.outputs.installed-key }}

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.product }}-${{ matrix.name }}
          path: |
            build/debug/vcpkg-manifest-install.log
            build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
